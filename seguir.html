<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1626">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Tu paquete en camino</title>
<link rel="icon" href="img/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --bg: #f2f3ff; --surface: #fff; --ink: #131b2e; --muted: #4a5568; --accent: #006948; --bad: #ba1a1a; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1626; --surface: #1b2335; --ink: #eef0ff; --muted: #aab4c8; --accent: #68dba9; --bad: #ffb4ab; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
#map { position: fixed; inset: 0; }
.card { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); z-index: 1000; max-width: 460px; margin: 0 auto;
  background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.22); display: flex; gap: 12px; align-items: center; }
.card img { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.card h1 { font-size: 1.05rem; margin: 0; }
.card p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.card.ok h1 { color: var(--accent); } .card.err h1 { color: var(--bad); }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; vertical-align: middle; animation: pulse 1.6s infinite; }
.live.off { background: #9ca3af; animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); } 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
.car { width: 46px; height: 46px; display: grid; place-items: center; transition: transform .8s linear; will-change: transform; }
.car svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
.house { width: 34px; height: 34px; border-radius: 50%; background: #006948; color: #fff; display: grid; place-items: center; font-size: 18px; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
#center { position: fixed; right: 14px; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 1000; border: 0; border-radius: 999px; padding: 12px 16px;
  background: var(--surface); color: var(--ink); font: 600 15px system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
</style>
</head>
<body>
<!-- Página pública que abre el cliente desde el WhatsApp del chofer. Solo muestra la posición del chofer
     mientras la parada de ESTE link no esté entregada (lo controla la función seguir_ver en Supabase). -->
<div id="map"></div>
<div class="card" id="card">
  <img src="img/icon-192.png" alt="">
  <div><h1 id="t">Buscando a tu repartidor…</h1><p id="m">Un segundo.</p></div>
</div>
<button id="center" type="button" hidden>◎ Ver al repartidor</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  const SUPABASE_URL = "https://rwutecnycvpmfciwxfwo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_DOQTW3KJrTvOOBJ8HKe06A_Y1JAVtop"; // clave pública; la tabla no se puede leer, solo seguir_ver(token)
  const $ = (id) => document.getElementById(id);
  const say = (t, m, c) => { $("t").textContent = t; $("m").innerHTML = m; $("card").className = "card" + (c ? " " + c : ""); };
  const token = (new URLSearchParams(location.hash.slice(1)).get("t") || new URLSearchParams(location.search).get("t") || "").trim();
  // el token no queda en el historial ni se manda a nadie más
  if (!/^[\w-]{20,}$/.test(token)) { say("Link incompleto", "Pedile al repartidor que te lo mande de nuevo.", "err"); return; }
  if (!window.L || !window.supabase) { say("No se pudo cargar el mapa", "Revisá tu internet y volvé a abrir el link.", "err"); return; }

  const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([-34.6037, -58.3816], 12);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 19, subdomains: "abcd", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

  const carIcon = L.divIcon({ className: "", iconSize: [46, 46], iconAnchor: [23, 23],
    html: '<div class="car"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fff"/><circle cx="24" cy="24" r="17" fill="#0f766e"/><path d="M24 11 33 33 24 28 15 33z" fill="#fff"/></svg></div>' });
  const houseIcon = L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17], html: '<div class="house">🏠</div>' });
  let car = null, house = null, etiqueta = "", canal = "", ch = null, estado = "";
  let shown = null, from = null, to = null, t0 = 0, dur = 1, lastT = 0, lastMsg = 0, lastSeen = 0, panAt = 0, rot = 0, follow = true, firstFit = true;

  const R = Math.PI / 180;
  const dist = (a, b) => { const x = (b[1] - a[1]) * R * Math.cos((a[0] + b[0]) / 2 * R), y = (b[0] - a[0]) * R; return Math.sqrt(x * x + y * y) * 6371000; };
  const bearing = (a, b) => { const y = Math.sin((b[1] - a[1]) * R) * Math.cos(b[0] * R), x = Math.cos(a[0] * R) * Math.sin(b[0] * R) - Math.sin(a[0] * R) * Math.cos(b[0] * R) * Math.cos((b[1] - a[1]) * R); return (Math.atan2(y, x) / R + 360) % 360; };
  const km = (m) => m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km";

  function setRot(deg) {
    // girar por el camino más corto (sin dar la vuelta entera al pasar de 359° a 0°)
    let d = ((deg - rot) % 360 + 540) % 360 - 180; rot += d;
    const el = car && car.getElement() && car.getElement().querySelector(".car"); if (el) el.style.transform = "rotate(" + rot + "deg)";
  }
  // nueva posición del chofer: el auto se desliza desde donde está hasta ahí en el tiempo que tardó en llegar el dato
  function nuevaPos(p, visto) {
    if (typeof p.lat !== "number" || typeof p.lng !== "number" || !(p.t > lastT)) return;
    const gap = lastT ? p.t - lastT : 0; lastT = p.t; lastSeen = Math.min(Date.now(), visto || Date.now()); if (!visto) lastMsg = Date.now();
    const ll = [p.lat, p.lng];
    if (!car) { car = L.marker(ll, { icon: carIcon, interactive: false, zIndexOffset: 1000 }).addTo(map); shown = ll; from = to = ll; if (typeof p.hd === "number") setRot(p.hd); encuadrar(); return; }
    const d = dist(shown, ll);
    if (d > 3000) { shown = from = to = ll; car.setLatLng(ll); encuadrar(); return; } // salto grande: sin animar
    from = shown; to = ll; t0 = performance.now(); dur = Math.min(Math.max(gap || 3000, 1000), 6000) * 1.05;
    if (d > 4) setRot(bearing(from, to)); else if (typeof p.hd === "number") setRot(p.hd);
  }
  function anim(now) {
    if (car && to && shown !== to) {
      const k = Math.min(1, (now - t0) / dur);
      shown = k >= 1 ? to : [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k];
      car.setLatLng(shown);
      if (follow && now - panAt > 1200 && !map.getBounds().pad(-0.15).contains(shown)) { panAt = now; if (house) map.fitBounds(L.latLngBounds([shown, house.getLatLng()]), { padding: [60, 60], paddingTopLeft: [40, 120], maxZoom: 17 }); else map.panTo(shown, { animate: true, duration: .8 }); }
    }
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
  function encuadrar() {
    if (!car) return;
    const pts = [car.getLatLng()]; if (house) pts.push(house.getLatLng());
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], paddingTopLeft: [40, 120], maxZoom: 17, animate: !firstFit });
    else map.setView(pts[0], 16, { animate: !firstFit });
    firstFit = false; follow = true; $("center").hidden = true;
  }
  map.on("dragstart", () => { follow = false; if (car) $("center").hidden = false; });
  $("center").addEventListener("click", encuadrar);

  function texto() {
    if (estado !== "en_camino") return;
    const vivo = lastMsg && Date.now() - lastMsg < 45000;
    const seg = lastSeen ? Math.max(0, Math.round((Date.now() - lastSeen) / 1000)) : null;
    const cuando = seg == null ? "Esperando la ubicación del repartidor…" : seg < 60 ? "Actualizado hace " + seg + " s" : "Última ubicación hace " + Math.round(seg / 60) + " min";
    const lejos = car && house ? " · a " + km(dist(shown, [house.getLatLng().lat, house.getLatLng().lng])) + " en línea recta" : "";
    say("Tu paquete " + etiqueta + " está en camino", '<span class="live' + (vivo ? "" : " off") + '"></span>' + cuando + lejos);
  }
  setInterval(texto, 1000);

  function escuchar(c) {
    if (c === canal && ch) return;
    if (ch) { try { sb.removeChannel(ch); } catch {} ch = null; }
    canal = c; if (!c) return;
    ch = sb.channel("seg-" + c, { config: { broadcast: { self: false } } });
    ch.on("broadcast", { event: "pos" }, ({ payload }) => { if (estado === "en_camino" && payload) nuevaPos(payload); });
    ch.subscribe();
  }
  function fin(t, m) {
    estado = "fin"; escuchar(""); clearTimeout(pollT);
    if (car) { map.removeLayer(car); car = null; }
    say(t, m, "ok"); $("center").hidden = true;
    if (house) map.setView(house.getLatLng(), 16);
  }
  let pollT = 0, fallos = 0;
  async function consultar() {
    try {
      const { data, error } = await sb.rpc("seguir_ver", { t: token });
      if (error) throw error;
      fallos = 0;
      const d = data || {};
      etiqueta = d.etiqueta || etiqueta;
      if (d.estado === "entregado") { fin("✅ Tu paquete " + etiqueta + " ya fue entregado", "El seguimiento terminó. ¡Gracias!"); return; }
      if (d.estado === "vencido") { fin("Este seguimiento terminó", "Si todavía esperás el paquete, pedile al repartidor un link nuevo."); return; }
      if (d.estado !== "en_camino") { estado = ""; say("Este link todavía no está activo", "Puede tardar unos segundos. Si sigue así, pedile al repartidor que te lo mande de nuevo.", "err"); pollT = setTimeout(consultar, 10000); return; }
      estado = "en_camino";
      if (typeof d.dest_lat === "number" && !house) { house = L.marker([d.dest_lat, d.dest_lng], { icon: houseIcon, interactive: false }).addTo(map); if (!car) map.setView(house.getLatLng(), 15, { animate: false }); }
      if (typeof d.lat === "number" && d.actualizado) { const t = Date.parse(d.actualizado); nuevaPos({ lat: d.lat, lng: d.lng, hd: d.rumbo, t }, t); if (!lastMsg && Date.now() - t < 45000) lastMsg = Date.now(); }
      escuchar(d.canal || "");
      texto();
    } catch (e) {
      if (++fallos >= 3 && estado !== "en_camino") say("Sin conexión", "Revisá tu internet. Volvemos a intentar solos.", "err");
    }
    // cada 8 s se revisa si ya se entregó o si el canal cambió (la posición llega por el canal en vivo)
    pollT = setTimeout(consultar, document.hidden ? 30000 : 8000);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && estado !== "fin") { clearTimeout(pollT); consultar(); } });
  consultar();
})();
</script>
</body>
</html>
