name: App de Android (APK)

on:
  push:
    branches: [main]
    paths: ["index.html", "img/**", "capacitor/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # el runner de GitHub ya trae el SDK de Android (ANDROID_HOME)
      - name: SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Copiar la app web
        run: mkdir -p www && cp ../index.html ../manifest.webmanifest www/ && cp -r ../img www/img

      - name: Crear el proyecto de Android
        run: |
          npx cap add android
          # permisos extra: cámara para el escáner
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
          # nombre del aviso fijo de ubicación
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_channel_name">Ubicación del reparto</string>\n</resources>#' android/app/src/main/res/values/strings.xml
          # ícono de la app
          cp -r res/* android/app/src/main/res/
          npx cap sync android

      - name: Armar el APK
        working-directory: capacitor/android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  ruta {
                      storeFile file("../../ruta-escaner.keystore")
                      storePassword "rutaescaner"
                      keyAlias "ruta"
                      keyPassword "rutaescaner"
                  }
              }
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ruta
                      minifyEnabled false
                  }
              }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ruta-escaner.apk

      - name: Publicar el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: App de Android
          body: |
            Instalá la app en Android: descargá **ruta-escaner.apk** y abrilo.
            Si el teléfono pregunta, permití instalar apps de esta fuente.
          files: capacitor/ruta-escaner.apk
          make_latest: true
